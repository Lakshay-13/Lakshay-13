<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title description">
<title id="title">NotifyMe</title>
<desc id="description">Profile-labelled alerts, local messaging, history sync, callbacks, and portable conversation data.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style>
<rect x="1" y="1" width="1198" height="234" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#b9a7ff" stroke-opacity=".5"/><text x="36" y="37" font-size="13" class="mono" letter-spacing="1" style="fill:#b9a7ff">ANDROID / DEVELOPER TOOLS</text><text x="36" y="83" font-size="38" font-weight="700" letter-spacing="-0.8">NotifyMe</text><text x="36" y="124" font-size="18" class="muted">Profile-labelled alerts, local messaging, history sync, callbacks, and</text><text x="36" y="148" font-size="18" class="muted">portable conversation data.</text><rect x="36" y="182" width="74" height="30" rx="15" fill="#b9a7ff" fill-opacity=".06" stroke="#b9a7ff" stroke-opacity=".24"/><text x="48" y="202" font-size="13" style="fill:#b9a7ff">Android</text><rect x="119" y="182" width="117" height="30" rx="15" fill="#b9a7ff" fill-opacity=".06" stroke="#b9a7ff" stroke-opacity=".24"/><text x="131" y="202" font-size="13" style="fill:#b9a7ff">Notifications</text><rect x="245" y="182" width="88" height="30" rx="15" fill="#b9a7ff" fill-opacity=".06" stroke="#b9a7ff" stroke-opacity=".24"/><text x="257" y="202" font-size="13" style="fill:#b9a7ff">Callbacks</text><path d="M 848 30 V 206" stroke="#243331"/><g transform="translate(1022 110)"><circle cx="0" cy="0" r="100" fill="url(#purple-glow)"/><g class="float"><path d="M -34 -5 V -24 A 34 34 0 0 1 34 -24 V -5 Q 34 12 47 22 H -47 Q -34 12 -34 -5 Z" fill="#13192a" stroke="#b9a7ff" stroke-width="2.5"/><path d="M -12 35 A 12 12 0 0 0 12 35" fill="none" stroke="#2effbf" stroke-width="3"/><circle class="signal" cx="29" cy="-42" r="8" fill="#2effbf"/><path class="breath" d="M -59 -42 Q -79 -7 -59 19 M 59 -42 Q 79 -7 59 19" fill="none" stroke="#b9a7ff" stroke-width="2"/></g><ellipse class="dash" rx="98" ry="72" fill="none" stroke="#2effbf" stroke-opacity=".25"/></g><text x="1022" y="211" font-size="11" class="mono" letter-spacing="1" text-anchor="middle" style="fill:#b9a7ff">EXPLORE PROJECT</text><path d="M 1150 33 H 1162 V 45 M 1149 46 L 1162 33" fill="none" stroke="#b9a7ff" stroke-width="1.5"/>
</svg>
