<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title description">
<title id="title">Customer Relationship Prediction</title>
<desc id="description">Predicting churn, appetency, and up-selling behavior from marketing databases.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="280" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#b9a7ff" stroke-opacity=".5"/><text x="36" y="38" font-size="17" class="mono" letter-spacing="0.5" style="fill:#afc9c2">DATA SCIENCE / PREDICTION</text><text x="36" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Customer Relationship Prediction</text><text x="36" y="126" font-size="24" style="fill:#c2cbd7">Predicting churn, appetency, and up-selling behavior from marketing</text><text x="36" y="159" font-size="24" style="fill:#c2cbd7">databases.</text><text x="36" y="241" font-size="18" style="fill:#9aadb9">Marketing / ML</text><g transform="translate(862 24)"><style>.customer-feature{animation:customerFeature 4s ease-in-out infinite}.customer-score{transform-box:fill-box;transform-origin:left;animation:customerScore 8s ease-in-out infinite}@keyframes customerFeature{0%,100%{opacity:.16}50%{opacity:.46}}@keyframes customerScore{0%,100%{transform:scaleX(.35);opacity:.5}50%,75%{transform:scaleX(1);opacity:1}}</style><g data-project-scene="true"><rect x="17" y="32" width="286" height="172" rx="13" fill="#121c2c" stroke="#37485b" /><text x="31" y="56" font-size="11" style="fill:#2effbf" >BEHAVIORAL PREDICTION</text><rect x="31" y="75" width="89" height="109" rx="7" fill="#142733" stroke="#344e60" /><rect x="41" y="86" width="17" height="9" rx="2" fill="#b9a7ff" stroke="none" class="customer-feature" style="animation-delay:-0.0s"/><rect x="65" y="86" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-0.3s"/><rect x="89" y="86" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-0.6s"/><rect x="41" y="104" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-0.45s"/><rect x="65" y="104" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-0.75s"/><rect x="89" y="104" width="17" height="9" rx="2" fill="#b9a7ff" stroke="none" class="customer-feature" style="animation-delay:-1.05s"/><rect x="41" y="122" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-0.9s"/><rect x="65" y="122" width="17" height="9" rx="2" fill="#b9a7ff" stroke="none" class="customer-feature" style="animation-delay:-1.2s"/><rect x="89" y="122" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-1.5s"/><rect x="41" y="140" width="17" height="9" rx="2" fill="#b9a7ff" stroke="none" class="customer-feature" style="animation-delay:-1.35s"/><rect x="65" y="140" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-1.6500000000000001s"/><rect x="89" y="140" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-1.9500000000000002s"/><rect x="41" y="158" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-1.8s"/><rect x="65" y="158" width="17" height="9" rx="2" fill="#2effbf" stroke="none" class="customer-feature" style="animation-delay:-2.1s"/><rect x="89" y="158" width="17" height="9" rx="2" fill="#b9a7ff" stroke="none" class="customer-feature" style="animation-delay:-2.4s"/><path d="M128 129H156M150 123 156 129 150 135" fill="none" stroke="#7f94a8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="172" y="84" font-size="12" style="fill:#d5e1ed" >Churn</text><rect x="172" y="94" width="113" height="6" rx="3" fill="#29394b" stroke="none" /><rect x="172" y="94" width="74" height="6" rx="3" fill="#b9a7ff" stroke="none" class="customer-score" style="animation-delay:-0.0s"/><text x="172" y="123" font-size="12" style="fill:#d5e1ed" >Appetency</text><rect x="172" y="133" width="113" height="6" rx="3" fill="#29394b" stroke="none" /><rect x="172" y="133" width="96" height="6" rx="3" fill="#2effbf" stroke="none" class="customer-score" style="animation-delay:-1.4s"/><text x="172" y="162" font-size="12" style="fill:#d5e1ed" >Upsell</text><rect x="172" y="172" width="113" height="6" rx="3" fill="#29394b" stroke="none" /><rect x="172" y="172" width="63" height="6" rx="3" fill="#8caad7" stroke="none" class="customer-score" style="animation-delay:-2.8s"/><text x="160" y="224" font-size="11" style="fill:#b0c2cf" text-anchor="middle">Features → Customer propensity</text></g></g>
</svg>
