<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-labelledby="title description">
<title id="title">Automated Notes Maker</title>
<desc id="description">Tooling for automated note creation from audio recordings.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="638" height="452" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 618" stroke="#2effbf" stroke-opacity=".5"/><text x="30" y="36" font-size="16" class="mono" letter-spacing="0.5" style="fill:#afc9c2">SPEECH / AUTOMATION</text><text x="30" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Automated Notes Maker</text><text x="30" y="126" font-size="25" style="fill:#c2cbd7">Tooling for automated note creation from audio</text><text x="30" y="159" font-size="25" style="fill:#c2cbd7">recordings.</text><text x="30" y="342" font-size="18" style="fill:#9aadb9">Speech / Python</text><g transform="translate(384 267) scale(.72)"><style>.notes-ink{stroke-dasharray:100;animation:notesInk 8s infinite}.notes-audio{animation:notesAudio 8s ease-in-out infinite}@keyframes notesInk{0%,20%,100%{stroke-dashoffset:100;opacity:.2}65%,88%{stroke-dashoffset:0;opacity:1}}@keyframes notesAudio{0%,100%{opacity:.25}30%,60%{opacity:1}}</style><g data-project-scene="true"><rect x="128" y="23" width="169" height="184" rx="10" fill="#1c2534" stroke="#3c5064" /><path d="M153 38V193" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="169" cy="64" r="3" fill="#2effbf" /><path d="M183 64H274" fill="none" stroke="#2effbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="notes-ink" style="animation-delay:-0.0s"/><circle cx="169" cy="97" r="3" fill="#2effbf" /><path d="M183 97H264" fill="none" stroke="#2effbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="notes-ink" style="animation-delay:-0.8s"/><circle cx="169" cy="130" r="3" fill="#2effbf" /><path d="M183 130H254" fill="none" stroke="#2effbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="notes-ink" style="animation-delay:-1.6s"/><circle cx="169" cy="163" r="3" fill="#2effbf" /><path d="M183 163H244" fill="none" stroke="#2effbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="notes-ink" style="animation-delay:-2.4000000000000004s"/><path d="M18 108 29 108 35 82 42 138 49 66 56 148 62 93 68 117 75 80 82 133 88 108H108" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="notes-audio"/><text x="22" y="173" font-size="13" style="fill:#b9a7ff" >AUDIO</text><text x="162" y="224" font-size="12" style="fill:#2effbf" >STRUCTURED NOTES</text></g></g>
</svg>
