<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-labelledby="title description">
<title id="title">ArtGridX</title>
<desc id="description">Portfolio publishing for artists, studios, and creative independents.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="638" height="452" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 618" stroke="#2effbf" stroke-opacity=".5"/><text x="30" y="36" font-size="16" class="mono" letter-spacing="0.5" style="fill:#afc9c2">PRODUCTS / CREATIVE TOOLS</text><text x="30" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">ArtGridX</text><text x="30" y="126" font-size="25" style="fill:#c2cbd7">Portfolio publishing for artists, studios, and creative</text><text x="30" y="159" font-size="25" style="fill:#c2cbd7">independents.</text><text x="30" y="342" font-size="18" style="fill:#9aadb9">Portfolios / Publishing / Creative tools</text><g transform="translate(384 267) scale(.72)"><style>.art-frame{stroke-dasharray:64 190;animation:artFrame 8s linear infinite}.art-layout{animation:artLayout 8s ease-in-out infinite}@keyframes artFrame{to{stroke-dashoffset:-254}}@keyframes artLayout{0%,100%{opacity:.55}45%,70%{opacity:1}}</style><g data-project-scene="true"><ellipse cx="160" cy="119" rx="109" ry="105" fill="url(#purple-glow)"/><g transform="translate(-95 -5) scale(1.12)"><rect x="154" y="25" width="147" height="178" rx="12" fill="#101824" stroke="#344251" /><text x="169" y="49" font-size="10" style="fill:#b4c2cd" >ARTIST STUDIO</text><rect x="169" y="61" width="59" height="68" rx="5" fill="#1a3439" stroke="#34535a" /><rect x="237" y="61" width="49" height="42" rx="5" fill="#28233c" stroke="#49425c" /><rect x="237" y="111" width="49" height="43" rx="5" fill="#19342c" stroke="#315849" /><path d="M177 119V73H220M246 72H278M246 79H272M246 86H276" fill="none" stroke="#5f8287" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="art-layout"><rect x="177" y="78" width="16" height="33" rx="3" fill="#294f4a" stroke="none" /><rect x="198" y="78" width="22" height="18" rx="3" fill="#65548d" stroke="none" /><rect x="198" y="101" width="22" height="10" rx="2" fill="#344358" stroke="none" /></g><path d="M245 145L254 120 266 139 277 125" fill="none" stroke="#b9a7ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="169" y="149" font-size="12" style="fill:#d5e1ed" >Templates</text><text x="169" y="176" font-size="11" style="fill:#a5bbc6" >Domains · Analytics</text><rect class="art-frame" x="169" y="61" width="59" height="68" rx="5" fill="none" stroke="#2effbf" stroke-width="1.4"/></g></g></g>
</svg>
