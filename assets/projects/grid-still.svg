<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title description">
<title id="title">Grid</title>
<desc id="description">Create customizable triangular tessellation patterns with colors, gradients, transparency, and high-resolution exports.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style>
<rect x="1" y="1" width="1198" height="280" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#2effbf" stroke-opacity=".5"/><text x="36" y="38" font-size="17" class="mono" letter-spacing="0.5" style="fill:#afc9c2">CREATIVE CODE / GENERATIVE DESIGN</text><text x="36" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Grid</text><text x="36" y="126" font-size="24" style="fill:#c2cbd7">Create customizable triangular tessellation patterns with colors, gradients,</text><text x="36" y="159" font-size="24" style="fill:#c2cbd7">transparency, and high-resolution exports.</text><text x="36" y="241" font-size="18" style="fill:#9aadb9">Tessellation / Patterns / Streamlit</text><g transform="translate(862 24)"><style>.grid-tile{animation:gridTile 8s ease-in-out infinite}@keyframes gridTile{0%,100%{fill-opacity:.08}45%,65%{fill-opacity:.7}}*{animation:none!important}</style><g data-project-scene="true"><text x="24" y="23" font-size="12" style="fill:#2effbf" >TRIANGULAR TESSELLATION</text><polygon points="25,80 43,44 61,80" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-0.0s"/><polygon points="62,80 80,44 98,80" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-0.4s"/><polygon points="99,80 117,44 135,80" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-0.8s"/><polygon points="136,80 154,44 172,80" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.2000000000000002s"/><polygon points="173,80 191,44 209,80" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.6s"/><polygon points="210,80 228,44 246,80" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.0s"/><polygon points="247,80 265,44 283,80" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.4000000000000004s"/><polygon points="25,119 43,83 61,119" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-0.7s"/><polygon points="62,119 80,83 98,119" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.1s"/><polygon points="99,119 117,83 135,119" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.5s"/><polygon points="136,119 154,83 172,119" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.9000000000000001s"/><polygon points="173,119 191,83 209,119" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.3s"/><polygon points="210,119 228,83 246,119" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.7s"/><polygon points="247,119 265,83 283,119" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-3.1000000000000005s"/><polygon points="25,158 43,122 61,158" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.4s"/><polygon points="62,158 80,122 98,158" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-1.7999999999999998s"/><polygon points="99,158 117,122 135,158" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.2s"/><polygon points="136,158 154,122 172,158" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.6s"/><polygon points="173,158 191,122 209,158" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-3.0s"/><polygon points="210,158 228,122 246,158" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-3.4s"/><polygon points="247,158 265,122 283,158" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-3.8000000000000003s"/><polygon points="25,197 43,161 61,197" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.0999999999999996s"/><polygon points="62,197 80,161 98,197" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.4999999999999996s"/><polygon points="99,197 117,161 135,197" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-2.8999999999999995s"/><polygon points="136,197 154,161 172,197" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-3.3s"/><polygon points="173,197 191,161 209,197" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-3.6999999999999997s"/><polygon points="210,197 228,161 246,197" fill="#2effbf" fill-opacity=".25" stroke="#2effbf" stroke-opacity=".55" class="grid-tile" style="animation-delay:-4.1s"/><polygon points="247,197 265,161 283,197" fill="#b9a7ff" fill-opacity=".25" stroke="#b9a7ff" stroke-opacity=".55" class="grid-tile" style="animation-delay:-4.5s"/><text x="95" y="226" font-size="11" style="fill:#b9a7ff" >COLOR / PATTERN / EXPORT</text></g></g>
</svg>
