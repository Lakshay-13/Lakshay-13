<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title description">
<title id="title">Music Genre Prediction</title>
<desc id="description">Predicting music genres using data analysis and ML techniques.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style>
<rect x="1" y="1" width="1198" height="280" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#2effbf" stroke-opacity=".5"/><text x="36" y="38" font-size="17" class="mono" letter-spacing="0.5" style="fill:#afc9c2">DATA SCIENCE / MUSIC</text><text x="36" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Music Genre Prediction</text><text x="36" y="126" font-size="24" style="fill:#c2cbd7">Predicting music genres using data analysis and ML techniques.</text><text x="36" y="241" font-size="18" style="fill:#9aadb9">Music / Python</text><g transform="translate(862 24)"><style>.music-record{transform-origin:102px 132px;animation:musicRecord 8s linear infinite}.music-feature{transform-box:fill-box;transform-origin:bottom;animation:musicFeature 4s ease-in-out infinite}@keyframes musicRecord{to{transform:rotate(360deg)}}@keyframes musicFeature{0%,100%{transform:scaleY(.35);opacity:.5}50%{transform:scaleY(1);opacity:.9}}*{animation:none!important}</style><g data-project-scene="true"><rect x="17" y="32" width="286" height="172" rx="14" fill="#111b2b" stroke="#3e4b61" /><text x="31" y="56" font-size="10" style="fill:#b6c4d3" >AUDIO / GENRE CLASSIFICATION</text><circle cx="102" cy="132" r="60" fill="#080f1a" stroke="#4c526c" stroke-width="1.2"/><g class="music-record"><circle cx="102" cy="132" r="51" fill="none" stroke="#343b50" stroke-width=".8"/><circle cx="102" cy="132" r="44" fill="none" stroke="#343b50" stroke-width=".8"/><circle cx="102" cy="132" r="37" fill="none" stroke="#343b50" stroke-width=".8"/><circle cx="102" cy="132" r="30" fill="none" stroke="#343b50" stroke-width=".8"/><path d="M68 93A52 52 0 0 1 147 108" fill="none" stroke="#b9a7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="102" cy="132" r="19" fill="#8477bd" /><circle cx="102" cy="132" r="10" fill="#212039" /><circle cx="102" cy="132" r="2.5" fill="#d5e1ed" /></g><circle cx="264" cy="79" r="8" fill="#243d41" /><circle cx="264" cy="79" r="3" fill="#2effbf" /><path d="M264 79H232L170 96 153 117" fill="none" stroke="#9ac3bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="145" y="112" width="18" height="10" rx="3" fill="#224b40" stroke="#2effbf" /><rect x="188" y="102" width="97" height="30" rx="7" fill="#18253a" stroke="#485071" /><text x="236.5" y="121" font-size="11" style="fill:#b9a7ff" text-anchor="middle">GENRE</text><text x="187" y="154" font-size="10" style="fill:#b7c7d5" >MFCC FEATURES</text><rect x="189" y="178" width="7" height="16" rx="2" fill="#2effbf" stroke="none" class="music-feature" style="animation-delay:-0.0s"/><rect x="202" y="171" width="7" height="23" rx="2" fill="#b9a7ff" stroke="none" class="music-feature" style="animation-delay:-0.4s"/><rect x="215" y="182" width="7" height="12" rx="2" fill="#2effbf" stroke="none" class="music-feature" style="animation-delay:-0.8s"/><rect x="228" y="166" width="7" height="28" rx="2" fill="#b9a7ff" stroke="none" class="music-feature" style="animation-delay:-1.2000000000000002s"/><rect x="241" y="174" width="7" height="20" rx="2" fill="#2effbf" stroke="none" class="music-feature" style="animation-delay:-1.6s"/><rect x="254" y="180" width="7" height="14" rx="2" fill="#b9a7ff" stroke="none" class="music-feature" style="animation-delay:-2.0s"/><rect x="267" y="170" width="7" height="24" rx="2" fill="#2effbf" stroke="none" class="music-feature" style="animation-delay:-2.4000000000000004s"/><text x="160" y="224" font-size="12" style="fill:#adc5cd" text-anchor="middle">Listen · Extract · Classify</text></g></g>
</svg>
