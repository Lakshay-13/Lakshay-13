<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title description">
<title id="title">Tree</title>
<desc id="description">Modern identity and profile surfaces built around interactive tree systems.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="234" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#2effbf" stroke-opacity=".5"/><text x="36" y="37" font-size="13" class="mono" letter-spacing="1" style="fill:#2effbf">PRODUCTS / IDENTITY</text><text x="36" y="83" font-size="38" font-weight="700" letter-spacing="-0.8">Tree</text><text x="36" y="124" font-size="18" class="muted">Modern identity and profile surfaces built around interactive tree systems.</text><rect x="36" y="182" width="81" height="30" rx="15" fill="#2effbf" fill-opacity=".06" stroke="#2effbf" stroke-opacity=".24"/><text x="48" y="202" font-size="13" style="fill:#2effbf">Identity</text><rect x="126" y="182" width="81" height="30" rx="15" fill="#2effbf" fill-opacity=".06" stroke="#2effbf" stroke-opacity=".24"/><text x="138" y="202" font-size="13" style="fill:#2effbf">Profiles</text><rect x="216" y="182" width="160" height="30" rx="15" fill="#2effbf" fill-opacity=".06" stroke="#2effbf" stroke-opacity=".24"/><text x="228" y="202" font-size="13" style="fill:#2effbf">Interactive systems</text><path d="M 848 30 V 206" stroke="#243331"/><g transform="translate(1022 110)"><circle cx="0" cy="0" r="100" fill="url(#mint-glow)"/><path d="M 0 -56 L -60 -5" stroke="#2effbf" stroke-opacity=".3"/><path class="flow" d="M 0 -56 L -60 -5" stroke="#2effbf" stroke-width="2" style="animation-delay:-0.0s"/><path d="M 0 -56 L 60 -5" stroke="#2effbf" stroke-opacity=".3"/><path class="flow" d="M 0 -56 L 60 -5" stroke="#2effbf" stroke-width="2" style="animation-delay:-0.6s"/><path d="M -60 -5 L -86 54" stroke="#2effbf" stroke-opacity=".3"/><path class="flow" d="M -60 -5 L -86 54" stroke="#2effbf" stroke-width="2" style="animation-delay:-1.2s"/><path d="M -60 -5 L -27 54" stroke="#2effbf" stroke-opacity=".3"/><path class="flow" d="M -60 -5 L -27 54" stroke="#2effbf" stroke-width="2" style="animation-delay:-1.7999999999999998s"/><path d="M 60 -5 L 27 54" stroke="#2effbf" stroke-opacity=".3"/><path class="flow" d="M 60 -5 L 27 54" stroke="#2effbf" stroke-width="2" style="animation-delay:-2.4s"/><path d="M 60 -5 L 86 54" stroke="#2effbf" stroke-opacity=".3"/><path class="flow" d="M 60 -5 L 86 54" stroke="#2effbf" stroke-width="2" style="animation-delay:-3.0s"/><circle cx="0" cy="-56" r="11" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="0" cy="-56" r="4.4" fill="#b9a7ff" style="animation-delay:-0.0s"/><circle cx="-60" cy="-5" r="7" fill="#0a171b" stroke="#2effbf" stroke-width="1.5"/><circle class="signal" cx="-60" cy="-5" r="2.8000000000000003" fill="#2effbf" style="animation-delay:-0.55s"/><circle cx="60" cy="-5" r="7" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="60" cy="-5" r="2.8000000000000003" fill="#b9a7ff" style="animation-delay:-1.1s"/><circle cx="-86" cy="54" r="7" fill="#0a171b" stroke="#2effbf" stroke-width="1.5"/><circle class="signal" cx="-86" cy="54" r="2.8000000000000003" fill="#2effbf" style="animation-delay:-1.6500000000000001s"/><circle cx="-27" cy="54" r="7" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="-27" cy="54" r="2.8000000000000003" fill="#b9a7ff" style="animation-delay:-2.2s"/><circle cx="27" cy="54" r="7" fill="#0a171b" stroke="#2effbf" stroke-width="1.5"/><circle class="signal" cx="27" cy="54" r="2.8000000000000003" fill="#2effbf" style="animation-delay:-2.75s"/><circle cx="86" cy="54" r="7" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="86" cy="54" r="2.8000000000000003" fill="#b9a7ff" style="animation-delay:-3.3000000000000003s"/></g><text x="1022" y="211" font-size="11" class="mono" letter-spacing="1" text-anchor="middle" style="fill:#2effbf">EXPLORE PROJECT</text><path d="M 1150 33 H 1162 V 45 M 1149 46 L 1162 33" fill="none" stroke="#2effbf" stroke-width="1.5"/>
</svg>
