<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title description">
<title id="title">Classifying Periodic Variable Stars</title>
<desc id="description">Time-series ML project classifying four classes of periodic variable stars.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="280" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#b9a7ff" stroke-opacity=".5"/><text x="36" y="38" font-size="17" class="mono" letter-spacing="0.5" style="fill:#afc9c2">DATA SCIENCE / ASTRONOMY</text><text x="36" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Classifying Periodic Variable Stars</text><text x="36" y="126" font-size="24" style="fill:#c2cbd7">Time-series ML project classifying four classes of periodic variable stars.</text><text x="36" y="241" font-size="18" style="fill:#9aadb9">ML / Astronomy</text><path d="M 852 28 V 254" stroke="#243331"/><g transform="translate(1022 125)"><rect x="-120" y="-108" width="240" height="216" rx="22" fill="#0c1420" stroke="#27333f"/><circle cx="0" cy="-8" r="84" fill="none" stroke="#b9a7ff" stroke-opacity=".16"/><g class="orbit"><circle cx="0" cy="-8" r="84" fill="none" stroke="#b9a7ff" stroke-opacity=".6" stroke-dasharray="20 508" stroke-width="2"/></g><path class="dash" d="M -66 -28 C -34 -66 10 30 66 -28" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-opacity="0.65"/><path class="dash" d="M -66 -2 C -34 -40 10 40 66 -2" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-opacity="0.53"/><path class="dash" d="M -66 24 C -34 -14 10 50 66 24" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-opacity="0.41000000000000003"/><text x="0" y="68" font-size="15" text-anchor="middle" class="mono" style="fill:#c2cbd7">ML</text><rect class="meter" x="-46" y="87" width="5" height="12" rx="2" fill="#b9a7ff" style="animation-delay:-0.0s"/><rect class="meter" x="-34" y="82" width="5" height="17" rx="2" fill="#b9a7ff" style="animation-delay:-0.4s"/><rect class="meter" x="-22" y="77" width="5" height="22" rx="2" fill="#b9a7ff" style="animation-delay:-0.8s"/><rect class="meter" x="-10" y="87" width="5" height="12" rx="2" fill="#b9a7ff" style="animation-delay:-1.2000000000000002s"/><rect class="meter" x="2" y="82" width="5" height="17" rx="2" fill="#b9a7ff" style="animation-delay:-1.6s"/><rect class="meter" x="14" y="77" width="5" height="22" rx="2" fill="#b9a7ff" style="animation-delay:-2.0s"/><rect class="meter" x="26" y="87" width="5" height="12" rx="2" fill="#b9a7ff" style="animation-delay:-2.4000000000000004s"/><rect class="meter" x="38" y="82" width="5" height="17" rx="2" fill="#b9a7ff" style="animation-delay:-2.8000000000000003s"/><rect class="meter" x="50" y="77" width="5" height="22" rx="2" fill="#b9a7ff" style="animation-delay:-3.2s"/></g><text x="1022" y="261" font-size="13" class="mono" letter-spacing="0.6" text-anchor="middle" style="fill:#b9a7ff">EXPLORE PROJECT</text>
</svg>
