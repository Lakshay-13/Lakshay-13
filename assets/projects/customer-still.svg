<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title description">
<title id="title">Customer Relationship Prediction</title>
<desc id="description">Predicting churn, appetency, and up-selling behavior from marketing databases.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style>
<rect x="1" y="1" width="1198" height="280" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 1178" stroke="#b9a7ff" stroke-opacity=".5"/><text x="36" y="38" font-size="17" class="mono" letter-spacing="0.5" style="fill:#afc9c2">DATA SCIENCE / PREDICTION</text><text x="36" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Customer Relationship Prediction</text><text x="36" y="126" font-size="24" style="fill:#c2cbd7">Predicting churn, appetency, and up-selling behavior from marketing</text><text x="36" y="159" font-size="24" style="fill:#c2cbd7">databases.</text><text x="36" y="241" font-size="18" style="fill:#9aadb9">Marketing / ML</text><g transform="translate(862 24)"><style>.customer-segment{animation:customerSegment 8s ease-in-out infinite}@keyframes customerSegment{0%,100%{opacity:.2;transform:translateY(5px)}45%,65%{opacity:1;transform:translateY(0)}}*{animation:none!important}</style><g data-project-scene="true"><text x="22" y="23" font-size="12" style="fill:#2effbf" >CHURN / APPETENCY / UPSELL</text><ellipse cx="81" cy="85" rx="48" ry="34" fill="#b9a7ff" fill-opacity=".055" stroke="#b9a7ff" stroke-opacity=".4"/><circle cx="93.0" cy="85.0" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-0.0s"/><circle cx="69.9" cy="91.8" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-0.3s"/><circle cx="82.6" cy="73.0" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-0.6s"/><circle cx="93.8" cy="96.1" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-0.8999999999999999s"/><circle cx="57.4" cy="82.2" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-1.2s"/><circle cx="103.8" cy="75.3" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-1.5s"/><circle cx="73.2" cy="104.3" r="3" fill="#b9a7ff" class="customer-segment" style="animation-delay:-1.7999999999999998s"/><path d="M74 85H88M81 78V92" fill="none" stroke="#b9a7ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="237" cy="89" rx="48" ry="34" fill="#2effbf" fill-opacity=".055" stroke="#2effbf" stroke-opacity=".4"/><circle cx="249.0" cy="89.0" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-1.0s"/><circle cx="225.9" cy="95.8" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-1.3s"/><circle cx="238.6" cy="77.0" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-1.6s"/><circle cx="249.8" cy="100.1" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-1.9s"/><circle cx="213.4" cy="86.2" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-2.2s"/><circle cx="259.8" cy="79.3" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-2.5s"/><circle cx="229.2" cy="108.3" r="3" fill="#2effbf" class="customer-segment" style="animation-delay:-2.8s"/><path d="M230 89H244M237 82V96" fill="none" stroke="#2effbf" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="167" cy="172" rx="48" ry="34" fill="#8caad7" fill-opacity=".055" stroke="#8caad7" stroke-opacity=".4"/><circle cx="179.0" cy="172.0" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-2.0s"/><circle cx="155.9" cy="178.8" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-2.3s"/><circle cx="168.6" cy="160.0" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-2.6s"/><circle cx="179.8" cy="183.1" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-2.9s"/><circle cx="143.4" cy="169.2" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-3.2s"/><circle cx="189.8" cy="162.3" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-3.5s"/><circle cx="159.2" cy="191.3" r="3" fill="#8caad7" class="customer-segment" style="animation-delay:-3.8s"/><path d="M160 172H174M167 165V179" fill="none" stroke="#8caad7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g></g>
</svg>
