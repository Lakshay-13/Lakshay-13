<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" role="img" aria-labelledby="title description">
<title id="title">FREN Bot</title>
<desc id="description">AI-powered communities with games, moderation, social loops, AI utilities, and premium workflows.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="638" height="350" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 618" stroke="#2effbf" stroke-opacity=".5"/><text x="30" y="35" font-size="12" class="mono" letter-spacing="1" style="fill:#2effbf">COMMUNITY / APPLIED AI</text><text x="30" y="81" font-size="34" font-weight="700" letter-spacing="-0.8">FREN Bot</text><text x="30" y="119" font-size="18" class="muted">AI-powered communities with games, moderation,</text><text x="30" y="143" font-size="18" class="muted">social loops, AI utilities, and premium</text><text x="30" y="167" font-size="18" class="muted">workflows.</text><rect x="30" y="314" width="88" height="30" rx="15" fill="#2effbf" fill-opacity=".06" stroke="#2effbf" stroke-opacity=".24"/><text x="42" y="334" font-size="13" style="fill:#2effbf">Community</text><rect x="127" y="314" width="110" height="30" rx="15" fill="#2effbf" fill-opacity=".06" stroke="#2effbf" stroke-opacity=".24"/><text x="139" y="334" font-size="13" style="fill:#2effbf">AI utilities</text><rect x="246" y="314" width="96" height="30" rx="15" fill="#2effbf" fill-opacity=".06" stroke="#2effbf" stroke-opacity=".24"/><text x="258" y="334" font-size="13" style="fill:#2effbf">Moderation</text><g transform="translate(500 243) scale(.72)"><circle cx="0" cy="0" r="100" fill="url(#mint-glow)"/><g class="float"><rect x="-56" y="-48" width="112" height="82" rx="24" fill="#0b1920" stroke="#2effbf" stroke-width="2"/><path d="M -28 34 L -42 50 L -40 26" fill="#0b1920" stroke="#2effbf" stroke-width="2"/><path d="M 0 -48 V -62" stroke="#b9a7ff" stroke-width="2"/><circle class="breath" cy="-66" r="4" fill="#b9a7ff"/><rect x="-34" y="-25" width="18" height="18" rx="8" fill="#2effbf"/><rect x="16" y="-25" width="18" height="18" rx="8" fill="#2effbf"/><path d="M -17 10 Q 0 24 17 10" fill="none" stroke="#b9a7ff" stroke-width="3"/></g><ellipse class="dash" rx="93" ry="68" fill="none" stroke="#2effbf" stroke-opacity=".3"/><circle cx="-78" cy="44" r="8" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="-78" cy="44" r="3.2" fill="#b9a7ff" style="animation-delay:-0s"/><circle cx="82" cy="-38" r="8" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="82" cy="-38" r="3.2" fill="#b9a7ff" style="animation-delay:-1.2s"/><circle cx="60" cy="60" r="8" fill="#0a171b" stroke="#b9a7ff" stroke-width="1.5"/><circle class="signal" cx="60" cy="60" r="3.2" fill="#b9a7ff" style="animation-delay:-2.4s"/></g><text x="30" y="254" font-size="12" class="mono" letter-spacing="1" style="fill:#2effbf">EXPLORE PROJECT</text><path d="M 170 251 H 185 M 180 246 L 185 251 L 180 256" fill="none" stroke="#2effbf" stroke-width="1.5"/>
</svg>
