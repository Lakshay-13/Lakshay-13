<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-labelledby="title description">
<title id="title">Transcribe App</title>
<desc id="description">A native macOS transcription app for audio and video, with local Whisper and optional OpenAI API modes.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style>
<rect x="1" y="1" width="638" height="452" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 618" stroke="#b9a7ff" stroke-opacity=".5"/><text x="30" y="36" font-size="16" class="mono" letter-spacing="0.5" style="fill:#afc9c2">SPEECH / TRANSCRIPTION</text><text x="30" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Transcribe App</text><text x="30" y="126" font-size="25" style="fill:#c2cbd7">A native macOS transcription app for audio and</text><text x="30" y="159" font-size="25" style="fill:#c2cbd7">video, with local Whisper and optional OpenAI API</text><text x="30" y="192" font-size="25" style="fill:#c2cbd7">modes.</text><text x="30" y="342" font-size="18" style="fill:#9aadb9">SwiftUI / Whisper / Transcription</text><g transform="translate(384 267) scale(.72)"><style>.transcript-reveal{animation:transcriptReveal 8s steps(28,end) infinite}@keyframes transcriptReveal{0%,100%{transform:translateX(0);width:232px}75%,90%{transform:translateX(232px);width:0}}*{animation:none!important}</style><g data-project-scene="true"><rect x="17" y="20" width="286" height="190" rx="12" fill="#162337" stroke="#3c5064" /><rect x="17" y="20" width="286" height="27" rx="10" fill="#2a3344" stroke="none" /><circle cx="33" cy="34" r="3" fill="#b7889a" /><circle cx="46" cy="34" r="3" fill="#bbaa80" /><circle cx="59" cy="34" r="3" fill="#83b79f" /><text x="191" y="39" font-size="10" style="fill:#b9a7ff" >LOCAL / API</text><path d="M37 84 48 84 53 73 59 98 65 66 71 99 78 78 83 87 89 84H281" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="37" y="123" font-size="12" style="fill:#b9a7ff" >AUDIO + VIDEO</text><rect x="33" y="143" width="253" height="42" rx="8" fill="#0c1929" stroke="none" /><text x="44" y="168" font-size="14" style="fill:#2effbf" >Speech becomes a transcript.</text><rect x="43" y="148" width="232" height="32" rx="0" fill="#0c1929" stroke="none" class="transcript-reveal"/></g></g>
</svg>
