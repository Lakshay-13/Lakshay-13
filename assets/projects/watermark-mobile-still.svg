<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-labelledby="title description">
<title id="title">Watermark Studio</title>
<desc id="description">Protected publishing workspace for image watermarking, branded exports, document protection, and controlled content distribution with per-user history and admin visibility.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
*{animation:none!important}</style>
<rect x="1" y="1" width="638" height="452" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 618" stroke="#b9a7ff" stroke-opacity=".5"/><text x="30" y="36" font-size="16" class="mono" letter-spacing="0.5" style="fill:#afc9c2">PRODUCTS / PUBLISHING</text><text x="30" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">Watermark Studio</text><text x="30" y="126" font-size="25" style="fill:#c2cbd7">Protected publishing workspace for image</text><text x="30" y="159" font-size="25" style="fill:#c2cbd7">watermarking, branded exports, document</text><text x="30" y="192" font-size="25" style="fill:#c2cbd7">protection, and controlled content distribution with</text><text x="30" y="225" font-size="25" style="fill:#c2cbd7">per-user history and admin visibility.</text><text x="30" y="342" font-size="18" style="fill:#9aadb9">Watermarking / PDF/DOCX / Publishing</text><g transform="translate(384 267) scale(.72)"><style>.watermark-stamp{animation:watermarkStamp 8s ease-in-out infinite}@keyframes watermarkStamp{0%,10%,100%{opacity:0}35%,85%{opacity:.95}}*{animation:none!important}</style><g data-project-scene="true"><rect x="28" y="21" width="225" height="176" rx="8" fill="#1c293c" stroke="#3c5064" /><circle cx="84" cy="72" r="25" fill="#8275b5" /><path d="M42 183 119 96 167 155 202 119 241 183" fill="#225949" stroke="#2effbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="watermark-stamp" transform="rotate(-20 150 113)"><rect x="67" y="96" width="166" height="34" rx="3" fill="#0d1520" stroke="#b9a7ff" /><text x="81" y="118" font-size="20" style="fill:#b9a7ff" >WATERMARK</text></g><rect x="254" y="160" width="44" height="39" rx="7" fill="#13362f" stroke="#2effbf" /><path d="M265 159V150A11 11 0 0 1 287 150V159" fill="none" stroke="#2effbf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="276" cy="179" r="3" fill="#2effbf" /></g></g>
</svg>
