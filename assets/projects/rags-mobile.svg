<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-labelledby="title description">
<title id="title">RAGS-Demo</title>
<desc id="description">Retrieval-Augmented Generation demo for enhanced information retrieval and response generation.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="638" height="452" rx="20" fill="url(#surface)" stroke="#243331"/><path d="M 22 1 H 618" stroke="#2effbf" stroke-opacity=".5"/><text x="30" y="36" font-size="16" class="mono" letter-spacing="0.5" style="fill:#afc9c2">NLP / RETRIEVAL</text><text x="30" y="86" font-size="36" font-weight="700" letter-spacing="-0.6">RAGS-Demo</text><text x="30" y="126" font-size="25" style="fill:#c2cbd7">Retrieval-Augmented Generation demo for</text><text x="30" y="159" font-size="25" style="fill:#c2cbd7">enhanced information retrieval and response</text><text x="30" y="192" font-size="25" style="fill:#c2cbd7">generation.</text><text x="30" y="342" font-size="18" style="fill:#9aadb9">NLP / AI</text><g transform="translate(384 267) scale(.72)"><style>.rag-match{animation:ragMatch 8s infinite}.rag-answer{transform-box:fill-box;transform-origin:left;animation:ragAnswer 8s infinite}@keyframes ragMatch{0%,100%{opacity:.15}30%,60%{opacity:1}}@keyframes ragAnswer{0%,24%,100%{transform:scaleX(.05);opacity:.15}65%,88%{transform:scaleX(1);opacity:1}}</style><g data-project-scene="true"><text x="26" y="25" font-size="12" style="fill:#2effbf" >RETRIEVE → GROUND → ANSWER</text><rect x="22" y="42" width="88" height="97" rx="7" fill="#172438" stroke="#3c5064" /><path d="M35 63H92" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 80H92" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 97H92" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="49" y="66" width="88" height="97" rx="7" fill="#172438" stroke="#3c5064" /><path d="M62 87H119" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M62 104H119" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M62 121H119" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="76" y="90" width="88" height="97" rx="7" fill="#172438" stroke="#3c5064" /><path d="M89 111H146" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M89 128H146" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M89 145H146" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="76" y="109" width="62" height="7" rx="2" fill="#2effbf" stroke="none" class="rag-match"/><path d="M159 103H185M178 96 185 103 178 110" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="193" y="65" width="105" height="134" rx="12" fill="#20283c" stroke="#b9a7ff" /><text x="204" y="91" font-size="12" style="fill:#b9a7ff" >ANSWER</text><rect x="206" y="110" width="71" height="5" rx="2" fill="#779996" stroke="none" class="rag-answer" style="animation-delay:-0.0s"/><rect x="206" y="128" width="60" height="5" rx="2" fill="#779996" stroke="none" class="rag-answer" style="animation-delay:-0.7s"/><rect x="206" y="146" width="76" height="5" rx="2" fill="#779996" stroke="none" class="rag-answer" style="animation-delay:-1.4s"/><rect x="206" y="164" width="42" height="5" rx="2" fill="#779996" stroke="none" class="rag-answer" style="animation-delay:-2.0999999999999996s"/></g></g>
</svg>
