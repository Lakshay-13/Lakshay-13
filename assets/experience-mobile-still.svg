<desc id="description">CEO at NextGenAISchool (05/2026 - Present); Researcher at CLARITY Lab, IIT Jodhpur (06/2026 - Present); Project Associate at IIT Jodhpur (12/2025 - 05/2026); Freelancer at Independent (05/2025 - 11/2025); R&amp;D Consultant at System 3 (01/2024 - 05/2025); Research Fellow (Computer Science) at Harvard SEAS (05/2024 - 07/2024); Researcher at StellarDNN (01/2023 - 08/2024); Learning Experience Supervisor + Analytics Consultant at Univ.AI (05/2022 - 12/2023); Big Data Analytics &amp; Data Science Intern at Appinventiv (02/2022 - 06/2022); Big Data Analytics &amp; Data Science Intern at Jio (08/2021 - 02/2022); Big Data Analytics &amp; Data Science Intern at Havells India Ltd (01/2021 - 07/2021)</desc>
