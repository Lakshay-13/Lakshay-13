<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1254" viewBox="0 0 640 1254" role="img" aria-labelledby="title description">
<title id="title">Toolkit</title>
<desc id="description">AI &amp; Machine Learning: PINNs, Neural Differential Equations, 3D Vision, 3D Generative Modeling, Computer Vision, Generative AI, LLMs, RAG, Agentic LLM Systems, Multi-Agent Workflows, Reinforcement Learning; Languages &amp; Frameworks: Python, TypeScript, Kotlin, SQL, PyTorch, TensorFlow, CUDA, Next.js, React, Jetpack Compose; LLM &amp; Data Stack: LangChain, LangGraph, OpenAI API, Google GenAI/Gemini API, Ollama, vLLM, Hugging Face, NumPy, Pandas, Hive, Hadoop, Spark, EDA, Data Visualization; Product &amp; Backend: FastAPI, Express.js, PostgreSQL, Redis, Docker, Linux, S3-Compatible Storage, Firebase/FCM; Developer Tools: Git, GitHub, GitHub Actions, API Design, Production Deployments, Observability</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="638" height="1252" rx="20" fill="url(#surface)" stroke="#243331"/><text x="36" y="48" font-size="32" font-weight="700">From research to production</text><text x="36" y="83" font-size="22" style="fill:#afbbc9">Data science / AI / systems</text><rect x="24" y="102" width="592" height="276" rx="14" fill="#101824"/><path d="M 36 118 V 358" stroke="#2effbf" stroke-opacity=".16" stroke-width="2"/><path class="flow" d="M 36 118 V 358" stroke="#2effbf" stroke-opacity=".6" stroke-width="2"/><text x="55" y="136" font-size="27" font-weight="700" style="fill:#d4dde9">AI &amp; Machine Learning</text><text x="55" y="182" font-size="29" style="fill:#b8c5d5">PINNs / Neural Differential Equations / 3D</text><text x="55" y="222" font-size="29" style="fill:#b8c5d5">Vision / 3D Generative Modeling /</text><text x="55" y="262" font-size="29" style="fill:#b8c5d5">Computer Vision / Generative AI / LLMs /</text><text x="55" y="302" font-size="29" style="fill:#b8c5d5">RAG / Agentic LLM Systems / Multi-Agent</text><text x="55" y="342" font-size="29" style="fill:#b8c5d5">Workflows / Reinforcement Learning</text><rect x="24" y="390" width="592" height="196" rx="14" fill="#0d1520"/><path d="M 36 406 V 566" stroke="#b9a7ff" stroke-opacity=".16" stroke-width="2"/><path class="flow" d="M 36 406 V 566" stroke="#b9a7ff" stroke-opacity=".6" stroke-width="2"/><text x="55" y="424" font-size="27" font-weight="700" style="fill:#d4dde9">Languages &amp; Frameworks</text><text x="55" y="470" font-size="29" style="fill:#b8c5d5">Python / TypeScript / Kotlin / SQL /</text><text x="55" y="510" font-size="29" style="fill:#b8c5d5">PyTorch / TensorFlow / CUDA / Next.js /</text><text x="55" y="550" font-size="29" style="fill:#b8c5d5">React / Jetpack Compose</text><rect x="24" y="598" width="592" height="236" rx="14" fill="#101824"/><path d="M 36 614 V 814" stroke="#2effbf" stroke-opacity=".16" stroke-width="2"/><path class="flow" d="M 36 614 V 814" stroke="#2effbf" stroke-opacity=".6" stroke-width="2"/><text x="55" y="632" font-size="27" font-weight="700" style="fill:#d4dde9">LLM &amp; Data Stack</text><text x="55" y="678" font-size="29" style="fill:#b8c5d5">LangChain / LangGraph / OpenAI API /</text><text x="55" y="718" font-size="29" style="fill:#b8c5d5">Google GenAI/Gemini API / Ollama / vLLM</text><text x="55" y="758" font-size="29" style="fill:#b8c5d5">/ Hugging Face / NumPy / Pandas / Hive /</text><text x="55" y="798" font-size="29" style="fill:#b8c5d5">Hadoop / Spark / EDA / Data Visualization</text><rect x="24" y="846" width="592" height="196" rx="14" fill="#0d1520"/><path d="M 36 862 V 1022" stroke="#b9a7ff" stroke-opacity=".16" stroke-width="2"/><path class="flow" d="M 36 862 V 1022" stroke="#b9a7ff" stroke-opacity=".6" stroke-width="2"/><text x="55" y="880" font-size="27" font-weight="700" style="fill:#d4dde9">Product &amp; Backend</text><text x="55" y="926" font-size="29" style="fill:#b8c5d5">FastAPI / Express.js / PostgreSQL / Redis</text><text x="55" y="966" font-size="29" style="fill:#b8c5d5">/ Docker / Linux / S3-Compatible Storage /</text><text x="55" y="1006" font-size="29" style="fill:#b8c5d5">Firebase/FCM</text><rect x="24" y="1054" width="592" height="156" rx="14" fill="#101824"/><path d="M 36 1070 V 1190" stroke="#2effbf" stroke-opacity=".16" stroke-width="2"/><path class="flow" d="M 36 1070 V 1190" stroke="#2effbf" stroke-opacity=".6" stroke-width="2"/><text x="55" y="1088" font-size="27" font-weight="700" style="fill:#d4dde9">Developer Tools</text><text x="55" y="1134" font-size="29" style="fill:#b8c5d5">Git / GitHub / GitHub Actions / API Design</text><text x="55" y="1174" font-size="29" style="fill:#b8c5d5">/ Production Deployments / Observability</text>
</svg>
