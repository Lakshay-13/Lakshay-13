<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1534" viewBox="0 0 640 1534" role="img" aria-labelledby="title description">
<title id="title">Toolkit</title>
<desc id="description">AI &amp; Machine Learning: PINNs, Neural Differential Equations, 3D Vision, 3D Generative Modeling, Computer Vision, Generative AI, LLMs, RAG, Agentic LLM Systems, Multi-Agent Workflows, Reinforcement Learning; Languages &amp; Frameworks: Python, TypeScript, Kotlin, SQL, PyTorch, TensorFlow, CUDA, Next.js, React, Jetpack Compose; LLM &amp; Data Stack: LangChain, LangGraph, OpenAI API, Google GenAI/Gemini API, Ollama, vLLM, Hugging Face, NumPy, Pandas, Hive, Hadoop, Spark, EDA, Data Visualization; Product &amp; Backend: FastAPI, Express.js, PostgreSQL, Redis, Docker, Linux, S3-Compatible Storage, Firebase/FCM; Developer Tools: Git, GitHub, GitHub Actions, API Design, Production Deployments, Observability</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#080d16"/><stop offset="1" stop-color="#141126"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65"/><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15"/><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65"/></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18"/><stop offset="1" stop-color="#2effbf" stop-opacity="0"/></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#b9a7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="638" height="1532" rx="20" fill="url(#surface)" stroke="#243331"/><text x="36" y="48" font-size="32" font-weight="700">From research to production</text><text x="36" y="83" font-size="22" style="fill:#afbbc9">Data science / AI / systems</text><rect x="36.0" y="110" width="180.0" height="120" rx="14" fill="#111d2d"/><rect x="99.0" y="123" width="54" height="54" rx="12" fill="#edf1f5"/><image x="107.0" y="131.0" width="38" height="38" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="126.0" y="207" font-size="19" text-anchor="middle" style="fill:#c9d5e1">OpenAI API</text><rect x="230.0" y="110" width="180.0" height="120" rx="14" fill="#111d2d"/><rect x="293.0" y="123" width="54" height="54" rx="12" fill="#edf1f5"/><image x="301.0" y="131.0" width="38" height="38" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="320.0" y="207" font-size="19" text-anchor="middle" style="fill:#c9d5e1">Codex</text><rect x="424.0" y="110" width="180.0" height="120" rx="14" fill="#111d2d"/><rect x="487.0" y="123" width="54" height="54" rx="12" fill="#edf1f5"/><image x="498.0" y="134.0" width="32" height="32" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/><text x="514.0" y="207" font-size="19" text-anchor="middle" style="fill:#c9d5e1">GPT / LLMs</text><rect x="36.0" y="246" width="180.0" height="120" rx="14" fill="#111d2d"/><text x="126.0" y="302" font-size="35" text-anchor="middle" class="mono" style="fill:#b9a7ff">{ / }</text><text x="126.0" y="343" font-size="19" text-anchor="middle" style="fill:#c9d5e1">API systems</text><rect x="230.0" y="246" width="180.0" height="120" rx="14" fill="#111d2d"/><path d="M 277.0 279 L 320.0 270" stroke="#486371" stroke-opacity=".45"/><path d="M 277.0 279 L 320.0 289" stroke="#486371" stroke-opacity=".45"/><path d="M 277.0 279 L 320.0 308" stroke="#486371" stroke-opacity=".45"/><circle class="signal" cx="277.0" cy="279" r="4.5" fill="#2effbf" style="animation-delay:-0.0s"/><path d="M 277.0 298 L 320.0 270" stroke="#486371" stroke-opacity=".45"/><path d="M 277.0 298 L 320.0 289" stroke="#486371" stroke-opacity=".45"/><path d="M 277.0 298 L 320.0 308" stroke="#486371" stroke-opacity=".45"/><circle class="signal" cx="277.0" cy="298" r="4.5" fill="#2effbf" style="animation-delay:-0.4s"/><path d="M 320.0 270 L 363.0 279" stroke="#486371" stroke-opacity=".45"/><path d="M 320.0 270 L 363.0 298" stroke="#486371" stroke-opacity=".45"/><circle class="signal" cx="320.0" cy="270" r="4.5" fill="#b9a7ff" style="animation-delay:-1.0s"/><path d="M 320.0 289 L 363.0 279" stroke="#486371" stroke-opacity=".45"/><path d="M 320.0 289 L 363.0 298" stroke="#486371" stroke-opacity=".45"/><circle class="signal" cx="320.0" cy="289" r="4.5" fill="#b9a7ff" style="animation-delay:-1.4s"/><path d="M 320.0 308 L 363.0 279" stroke="#486371" stroke-opacity=".45"/><path d="M 320.0 308 L 363.0 298" stroke="#486371" stroke-opacity=".45"/><circle class="signal" cx="320.0" cy="308" r="4.5" fill="#b9a7ff" style="animation-delay:-1.8s"/><circle class="signal" cx="363.0" cy="279" r="4.5" fill="#2effbf" style="animation-delay:-2.0s"/><circle class="signal" cx="363.0" cy="298" r="4.5" fill="#2effbf" style="animation-delay:-2.4s"/><text x="320.0" y="343" font-size="17" text-anchor="middle" style="fill:#c9d5e1">PINNs / Neural nets</text><rect x="24" y="382" width="592" height="276" rx="14" fill="#101824"/><circle class="signal" cx="39" cy="408" r="2.5" fill="#2effbf" style="animation-delay:-0.0s"/><text x="55" y="416" font-size="27" font-weight="700" style="fill:#d4dde9">AI &amp; Machine Learning</text><text x="55" y="462" font-size="29" style="fill:#b8c5d5">PINNs / Neural Differential Equations / 3D</text><text x="55" y="502" font-size="29" style="fill:#b8c5d5">Vision / 3D Generative Modeling /</text><text x="55" y="542" font-size="29" style="fill:#b8c5d5">Computer Vision / Generative AI / LLMs /</text><text x="55" y="582" font-size="29" style="fill:#b8c5d