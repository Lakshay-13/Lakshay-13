<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title">
<title id="title">Audio turns into structured notes</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86cdff"/><stop offset="1" stop-color="#8df6cf"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c2d49"/><stop offset="1" stop-color="#0c101c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#86cdff" stop-opacity=".26"/><stop offset="1" stop-color="#86cdff" stop-opacity="0"/></radialGradient>
  <linearGradient id="wave-ink" gradientUnits="userSpaceOnUse" x1="122" x2="257" y1="0" y2="0"><stop stop-color="#86cdff"/><stop offset="1" stop-color="#8df6cf"/></linearGradient>
</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .wave-bars path{transform-box:fill-box;transform-origin:center;animation:wave-beat 2s ease-in-out infinite}
  .wave-bars path:nth-child(2){animation-delay:-.55s}
  @keyframes wave-beat{0%,100%{transform:scaleY(1);opacity:1}50%{transform:scaleY(.68);opacity:.76}}
  @media(prefers-reduced-motion:reduce){.wave-bars path{animation:none}}
</style>
<ellipse cx="328" cy="220" rx="244" ry="167" fill="url(#light)" /><g fill="none" stroke="#a4ecff" stroke-width="3" stroke-linecap="round"><rect x="189" y="93" width="10" height="21" rx="5"/><path d="M184 107v3a10 10 0 0 0 20 0v-3m-10 13v7m-5 0h10"/></g><rect x="104" y="148" width="180" height="112" rx="21" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/>
<path d="M122 205H257" stroke="url(#wave-ink)" stroke-opacity=".22"/>
<g class="wave-bars" fill="none" stroke="url(#wave-ink)" stroke-width="4" stroke-linecap="round">
  <path d="M122 197.5v15 M152 172.5v65 M182 166v78 M212 190v30 M242 193v24"/>
  <path d="M137 186.5v37 M167 186v38 M197 174v62 M227 181v48 M257 179.5v51"/>
</g>
<path d="M310 203h24m-8-8 8 8-8 8" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="370" y="94" width="153" height="219" rx="17" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><text x="446" y="127" text-anchor="middle" class="fine">Notes</text><circle cx="393" cy="158" r="3" fill="#9effe6" opacity="1"/><path d="M404 158h93" fill="none" stroke="#a4bddf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="393" cy="188" r="3" fill="#9effe6" opacity="1"/><path d="M404 188h73" fill="none" stroke="#a4bddf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="393" cy="218" r="3" fill="#9effe6" opacity="1"/><path d="M404 218h89" fill="none" stroke="#a4bddf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="393" cy="248" r="3" fill="#9effe6" opacity="1"/><path d="M404 248h69" fill="none" stroke="#a4bddf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="393" cy="278" r="3" fill="#9effe6" opacity="1"/><path d="M404 278h92" fill="none" stroke="#a4bddf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
