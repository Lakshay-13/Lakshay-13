<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="-10 -8 380 256" role="img" aria-labelledby="title"><title id="title">RL-PINNs</title><defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f" /><stop offset=".55" stop-color="#080d16" /><stop offset="1" stop-color="#141126" /></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65" /><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15" /><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65" /></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18" /><stop offset="1" stop-color="#2effbf" stop-opacity="0" /></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18" /><stop offset="1" stop-color="#b9a7ff" stop-opacity="0" /></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.rl-sample{animation:rlSample 4s ease-in-out infinite}@keyframes rlSample{0%,100%{opacity:.25}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(20 0)"><g data-project-scene="true"><text x="18" y="26" font-size="12" style="fill:#d5e1ed">ADAPTIVE PINN TRAINING</text><rect x="18" y="47" width="168" height="126" rx="4" fill="#101b28" stroke="#35485a" /><path d="M30 64H173" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 86H173" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 108H173" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 130H173" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 152H173" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M31 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M54 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M77 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M123 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M146 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M169 58V163" fill="none" stroke="#253748" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 146C59 151 75 72 103 88S144 156 173 75" fill="none" stroke="#b9a7ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="40" cy="119" r="3.5" fill="#2effbf" class="rl-sample" style="animation-delay:-0.0s" /><circle cx="63" cy="103" r="3.5" fill="#2effbf" class="rl-sample" style="animation-delay:-0.6s" /><circle cx="87" cy="87" r="3.5" fill="#2effbf" class="rl-sample" style="animation-delay:-1.2s" /><circle cx="110" cy="108" r="3.5" fill="#2effbf" class="rl-sample" style="animation-delay:-1.7999999999999998s" /><circle cx="139" cy="122" r="3.5" fill="#2effbf" class="rl-sample" style="animation-delay:-2.4s" /><circle cx="160" cy="99" r="3.5" fill="#2effbf" class="rl-sample" style="animation-delay:-3.0s" /><rect x="228" y="67" width="73" height="34" rx="4" fill="#172237" stroke="#62708c" /><text x="242" y="89" font-size="12" style="fill:#b9a7ff">POLICY</text><path d="M229 81H207V107H189M195 103 189 107 195 111" fill="none" stroke="#b9a7ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M189 147H265V106M261 113 265 106 269 113" fill="none" stroke="#2effbf" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="57" font-size="9" style="fill:#b9a7ff">ACTION</text><text x="226" y="169" font-size="9" style="fill:#2effbf">STATE</text><text x="29" y="191" font-size="11" style="fill:#a8b8c9">Residual field / adaptive sampling</text></g></g></svg>
