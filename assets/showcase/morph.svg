<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title">
<title id="title">Graphs interpolate into an animated GIF</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bf9bff"/><stop offset="1" stop-color="#7ae4fc"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292048"/><stop offset="1" stop-color="#0c101c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#bf9bff" stop-opacity=".26"/><stop offset="1" stop-color="#bf9bff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .pulse{stroke-dasharray:4 14;animation:flow 2.7s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-36}}
  @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<ellipse cx="326" cy="210" rx="246" ry="170" fill="url(#light)" /><rect x="91" y="131" width="134" height="141" rx="15" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><path d="M105 240h104m-104 0v-85" fill="none" stroke="#a5b5d2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/><path d="M107 228c25-62 36 44 58-6 23-53 26 29 44-19" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="253" y="131" width="134" height="141" rx="15" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><path d="M267 240h104m-104 0v-85" fill="none" stroke="#a5b5d2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/><path d="M270 226c25-34 41 15 58-16 17-32 27 13 42-17" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="415" y="131" width="134" height="141" rx="15" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><path d="M429 240h104m-104 0v-85" fill="none" stroke="#a5b5d2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/><path d="M432 218c22-13 44-1 57-19 14-20 27-5 43-16" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M226 203h27m134 0h28" fill="none" stroke="#d9fffd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="pulse" opacity=".88"/><text x="320" y="315" text-anchor="middle" class="fine">Interpolate between frames</text>
</svg>
