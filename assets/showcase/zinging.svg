<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title">
<title id="title">Zinging evolves while it chats, banters and automates</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bf9bff"/><stop offset="1" stop-color="#7ae4fc"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292048"/><stop offset="1" stop-color="#0c101c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#bf9bff" stop-opacity=".26"/><stop offset="1" stop-color="#bf9bff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .pulse{stroke-dasharray:0 18;stroke-linecap:round;animation:flow 2.5s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-36}}
  .orbit-arrows{transform-origin:320px 210px;animation:arrow-orbit 5s linear infinite}
  /* Three equally spaced arrows make a 120-degree turn a seamless loop. */
  @keyframes arrow-orbit{to{transform:rotate(120deg)}}
  .inner-sweep{stroke-dasharray:14 86;stroke-linecap:round;animation:inner-sweep 5s linear infinite}
  @keyframes inner-sweep{to{stroke-dashoffset:100}}
  .rim-tag circle{fill:#04100b;stroke:#9cff1f;stroke-width:2}
  .rim-tag text{animation:rim-drift 5s ease-in-out infinite}.rim-tag.late text{animation-delay:-2.5s}@keyframes rim-drift{50%{translate:0 -6px}}
  @media(prefers-reduced-motion:reduce){.pulse,.orbit-arrows,.inner-sweep,.rim-tag text{animation:none}}
</style>
<ellipse cx="320" cy="211" rx="253" ry="193" fill="url(#light)"/>
<circle cx="320" cy="210" r="140" fill="none" stroke="url(#ink)" stroke-opacity=".42"/>
<circle cx="320" cy="210" r="140" pathLength="900" fill="none" stroke="#0afa9e" stroke-width="2.5" stroke-opacity=".7" class="pulse"/>
<g class="orbit-arrows" fill="#9cff1f" stroke="#04100b" stroke-width="1.25" stroke-linejoin="round">
  <path transform="rotate(-36 320 210) translate(460 210)" d="M0 0-5-9 0-7 5-9Z"/>
  <path transform="rotate(84 320 210) translate(460 210)" d="M0 0-5-9 0-7 5-9Z"/>
  <path transform="rotate(204 320 210) translate(460 210)" d="M0 0-5-9 0-7 5-9Z"/>
</g>
<circle cx="320" cy="210" r="87" fill="none" stroke="url(#ink)" stroke-opacity=".61"/>
<circle cx="320" cy="210" r="87" pathLength="100" class="inner-sweep" fill="none" stroke="#0afa9e" stroke-width="2" stroke-opacity=".75"/>
<svg x="268" y="158" width="104" height="104" viewBox="0 0 100 100"><clipPath id="zinging-round"><rect width="100" height="100" rx="23"/></clipPath><image href="data:image/webp;base64," width="100" height="100" clip-path="url(#zinging-round)"/></svg>
<g class="rim-tag"><circle cx="320" cy="70" r="5"/><text x="320" y="49" class="label" text-anchor="middle">Banter</text></g>
<g class="rim-tag late"><circle cx="186.77" cy="253" r="5"/><text x="130" y="284" class="label" text-anchor="middle">Automation</text></g>
<g class="rim-tag"><circle cx="453.23" cy="253" r="5"/><text x="500" y="283" class="label" text-anchor="middle">Maps</text></g>
<text x="320" y="390" text-anchor="middle" class="fine">Self-evolving Discord bot</text>
</svg>
