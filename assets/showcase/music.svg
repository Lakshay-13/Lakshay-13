</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .wave-bars path{transform-box:fill-box;transform-origin:center;animation:wave-beat 2s ease-in-out infinite}
  .wave-bars path:nth-child(2){animation-delay:-.55s}
  @keyframes wave-beat{0%,100%{transform:scaleY(1);opacity:1}50%{transform:scaleY(.68);opacity:.76}}
  @media(prefers-reduced-motion:reduce){.wave-bars path{animation:none}}
</style>
