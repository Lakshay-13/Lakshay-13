<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title">
<title id="title">PINN Hub scientific solver and model workspace</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86cdff"/><stop offset="1" stop-color="#8df6cf"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c2d49"/><stop offset="1" stop-color="#0c101c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#86cdff" stop-opacity=".26"/><stop offset="1" stop-color="#86cdff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .pulse{stroke-dasharray:4 14;animation:flow 2.7s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-36}}
  @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<ellipse cx="327" cy="211" rx="289" ry="177" fill="url(#light)"/>
<rect x="105" y="72" width="430" height="276" rx="19" fill="url(#panel)" stroke="#8bb7dd" stroke-opacity=".55"/>
<path d="M105 118h430m-303 0v230" stroke="#88b2d2" stroke-opacity=".27"/>
<circle cx="126" cy="94" r="3.3" fill="#a4ffd9"/><circle cx="139" cy="94" r="3.3" fill="#acdfff"/><circle cx="152" cy="94" r="3.3" fill="#c5b2ff"/>
<text x="320" y="100" text-anchor="middle" class="label">PINN Hub</text>
<text x="168" y="160" text-anchor="middle" class="fine">Equation</text>
<rect x="126" y="173" width="85" height="35" rx="7" fill="#142b40" stroke="#83b8d4" stroke-opacity=".48"/>
<text x="168" y="195" text-anchor="middle" class="fine">ODE / PDE</text>
<text x="168" y="249" text-anchor="middle" class="fine">Solver</text>
<path d="M141 267h53m-53 12h40m-40 12h48" stroke="#9bd9ed" stroke-opacity=".55" stroke-linecap="round" stroke-width="3"/>
<path d="M269 281h226m-226 0v-120" fill="none" stroke="#8ab8d5" stroke-opacity=".44"/>
<path d="M270 266c26-1 27-52 51-55 28-3 34 51 63 37 32-17 28-55 55-55 22 0 26 24 54-28" fill="none" stroke="#9ff8df" stroke-width="3.5" stroke-linecap="round"/>
<path d="M270 266c26-1 27-52 51-55 28-3 34 51 63 37 32-17 28-55 55-55 22 0 26 24 54-28" fill="none" stroke="#f1fff7" stroke-width="2.4" class="pulse"/>
<circle cx="321" cy="211" r="4" fill="#bdfff0"/><circle cx="439" cy="193" r="4" fill="#bdfff0"/>
<text x="380" y="316" text-anchor="middle" class="fine">Solution &amp; model artifacts</text>
</svg>
