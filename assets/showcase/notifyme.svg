<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title">
<title id="title">NotifyMe phone with delivered notifications and callback</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7a8d1"/><stop offset="1" stop-color="#a998ff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#32213f"/><stop offset="1" stop-color="#0c101c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#f7a8d1" stop-opacity=".26"/><stop offset="1" stop-color="#f7a8d1" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .pulse{stroke-dasharray:4 14;animation:flow 2.7s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-36}}
  .notification{animation:notification 7.2s ease-in-out infinite both}.second{animation-delay:.38s}.third{animation-delay:.76s}@keyframes notification{0%,6%{opacity:0;transform:translateY(-13px)}17%,81%{opacity:1;transform:translateY(0)}94%,100%{opacity:0;transform:translateY(-5px)}}
  @media(prefers-reduced-motion:reduce){.pulse,.notification{animation:none}}
</style>
<ellipse cx="318" cy="210" rx="219" ry="176" fill="url(#light)"/>
<rect x="220" y="37" width="200" height="346" rx="31" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".76"/>
<rect x="231" y="49" width="178" height="322" rx="23" fill="#151427"/>
<path d="M300 62h40m-38 295h36" stroke="#a899ca" stroke-width="3.5" stroke-linecap="round"/>
<svg x="298" y="84" width="44" height="44" viewBox="0 0 100 100"><clipPath id="logo_notifyme-round"><rect width="100" height="100" rx="23"/></clipPath><image href="data:image/webp;base64," width="100" height="100" clip-path="url(#logo_notifyme-round)"/></svg>
<text x="320" y="152" text-anchor="middle" class="label">NotifyMe</text>
<g class="notification"><rect x="242" y="175" width="156" height="44" rx="10" fill="#302449" stroke="#c79de2" stroke-opacity=".45"/><circle cx="258" cy="197" r="4.5" fill="#f8acd8"/><text x="272" y="202" class="fine">Job complete</text></g>
<g class="notification second"><rect x="242" y="229" width="156" height="44" rx="10" fill="#2d2850" stroke="#bbafea" stroke-opacity=".46"/><circle cx="258" cy="251" r="4.5" fill="#bfaaff"/><text x="272" y="256" class="fine">Callback ready</text></g>
<g class="notification third"><rect x="242" y="283" width="156" height="44" rx="10" fill="#242f49" stroke="#a5b6df" stroke-opacity=".45"/><circle cx="258" cy="305" r="4.5" fill="#aaf1dd"/><text x="272" y="310" class="fine">History synced</text></g>
</svg>
